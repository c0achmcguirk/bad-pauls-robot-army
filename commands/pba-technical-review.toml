description = "Read a document (local file or Google Docs/Sheets/Slides URL) and produce a deeply verified, annotated review with 5-level code verification, claim-by-claim fact-checking, and verification trails"
prompt = '''
First, activate the 'pba-workspace-tools' skill to ensure you have the correct tool mappings for this environment.

Using the technical-reviewer skill, read a document, verify its claims, and produce an annotated reviewed copy with section-by-section commentary and an overall assessment.

## Tool Configuration

**IMPORTANT**: Consult the pba-workspace-tools skill for your organization's configured tools.
Use ONLY the tools listed in the Active Configuration section of pba-workspace-tools.
If a capability is not configured, inform the user and continue with available capabilities.

## Input Parsing

The user invoked: /pba-technical-review {{args}}

The argument can be either a **local file path** or a **Google Docs/Sheets/Slides URL**.

Examples:
- `/pba-technical-review reports/proposal-20260205.md` - Review a local document
- `/pba-technical-review docs/architecture.md` - Review local architecture documentation
- `/pba-technical-review README.md` - Review the project README
- `/pba-technical-review https://docs.google.com/document/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms/edit` - Download and review a Google Doc
- `/pba-technical-review https://docs.google.com/spreadsheets/d/1abc123def/edit` - Download and review a Google Sheet
- `/pba-technical-review https://docs.google.com/presentation/d/1xyz789ghi/edit` - Download and review Google Slides

If no argument is provided, inform the user:
```
Usage: /pba-technical-review <path-to-document-or-google-url>

Supports:
- Local file paths: reports/proposal.md, docs/architecture.md
- Google Docs: https://docs.google.com/document/d/{ID}/...
- Google Sheets: https://docs.google.com/spreadsheets/d/{ID}/...
- Google Slides: https://docs.google.com/presentation/d/{ID}/...
```
Do not proceed without an argument.

### Classify the input

- If the argument contains `docs.google.com/document/`, `docs.google.com/spreadsheets/`, or `docs.google.com/presentation/` — it is a **Google URL**. Proceed to **Phase 0**.
- Otherwise — it is a **local file path**. Skip Phase 0 and proceed directly to Phase 1.

---

## Phase 0: Google Document Preprocessing

This phase downloads a Google document, converts it to markdown, and saves it locally. After this phase completes, all subsequent phases operate on the local converted file identically to a local file path input.

### Step 0a: URL Classification and ID Extraction

Identify the document type and extract the document ID from the URL:

| URL contains | Document Type | Export format |
|---|---|---|
| `docs.google.com/document/d/{ID}` | Google Doc | HTML |
| `docs.google.com/spreadsheets/d/{ID}` | Google Sheet | CSV |
| `docs.google.com/presentation/d/{ID}` | Google Slides | Plain text |

The document ID is the string between `/d/` and the next `/` (or the end of the URL if there is no trailing path). It is typically a long alphanumeric string with hyphens and underscores.

If the URL does not match any of these patterns, inform the user:
"This URL does not appear to be a Google Docs, Sheets, or Slides URL. Please provide a recognized Google URL or a local file path."
Do not proceed.

### Step 0b: Download the Document

Construct the export URL based on document type:
- **Google Doc**: `https://docs.google.com/document/d/{ID}/export?format=html`
- **Google Sheet**: `https://docs.google.com/spreadsheets/d/{ID}/export?format=csv`
- **Google Slides**: `https://docs.google.com/presentation/d/{ID}/export?format=txt`

**Attempt 1 — Public access:**
```bash
curl -sL -w '%{http_code}' -o /tmp/gdoc_export_raw "EXPORT_URL"
```
Check the HTTP status code. Also check whether the downloaded content is a Google sign-in page (contains "accounts.google.com" or "ServiceLogin") rather than actual document content. If the status is 200 and the content is not a sign-in page, the download succeeded.

**Attempt 2 — Authenticated access (if Attempt 1 failed):**
Check if `gcloud` is available and authenticated:
```bash
gcloud auth print-access-token 2>/dev/null
```
If a token is returned, retry with authentication:
```bash
curl -sL -H "Authorization: Bearer $(gcloud auth print-access-token)" -o /tmp/gdoc_export_raw "EXPORT_URL"
```

**If both attempts fail**, inform the user:
```
Unable to access the Google document. The document may be private or require authentication.

Possible solutions:
1. Make the document accessible via "Anyone with the link" sharing
2. Ensure gcloud CLI is installed and authenticated (gcloud auth login)
3. Download the document manually and provide a local file path instead
```
Do not proceed to Phase 1.

### Step 0c: Extract Document Title

**For Google Docs (HTML export):**
Parse the `<title>` tag from the downloaded HTML file. Strip any trailing " - Google Docs" suffix.

**For Google Sheets and Slides:**
Fetch the document's web page to extract the title:
```bash
curl -sL "ORIGINAL_URL" | grep -oP '<title>\K[^<]+'
```
Strip any trailing " - Google Sheets" or " - Google Slides" suffix.

**Fallback:** If the title cannot be extracted by any method, use `GoogleDoc_{first8chars of document ID}` as the title.

### Step 0d: Convert to Markdown

**Google Docs (HTML):**
1. Check if pandoc is installed: `which pandoc`
2. If pandoc is available:
   ```bash
   pandoc -f html -t markdown --wrap=none /tmp/gdoc_export_raw -o /tmp/gdoc_converted.md
   ```
3. If pandoc is NOT available: Read the HTML file, then produce equivalent markdown manually. Preserve headings, lists, tables, links, bold/italic formatting. Strip all HTML tags, style attributes, and Google-specific markup. Inform the user: "Note: pandoc is not installed. Performing manual HTML-to-markdown conversion. For best results, install pandoc."

**Google Sheets (CSV):**
Read the CSV file and convert it to a markdown table:
```
| Header1 | Header2 | Header3 |
|---------|---------|---------|
| value1  | value2  | value3  |
```
Note: The CSV export only includes the first sheet. If the spreadsheet has multiple sheets, inform the user.

**Google Slides (plain text):**
Format the text content with `## Slide N` headings for each slide boundary. Preserve bullet points as markdown lists. Add horizontal rules (`---`) between slides.

### Step 0e: Save Converted File

**Naming convention:** `reports/YYYYMMDD_HHMM_<SanitizedTitle>_converted.md`

Generate the timestamp:
```bash
date +%Y%m%d_%H%M
```

**Title sanitization rules:**
1. Remove spaces to form CamelCase (capitalize the first letter of each word, remove spaces)
2. Remove all characters that are not alphanumeric or underscores
3. Truncate to 50 characters if longer

Examples:
- "My Design Document" → `MyDesignDocument`
- "Q4 2026 Revenue Projections" → `Q42026RevenueProjections`
- Title unavailable, ID `1BxiMVs0XRA5n...` → `GoogleDoc_1BxiMVs0`

**Save the file:**
1. Create the `reports/` directory if it does not exist
2. Write the converted markdown content to `reports/YYYYMMDD_HHMM_<SanitizedTitle>_converted.md`
3. Inform the user: "Google document downloaded and converted to: [full path]"

**Set DOCUMENT_PATH** to this new local file path. From this point forward, all phases use DOCUMENT_PATH as the document to review, identically to a local file path input.

Store the original Google URL as GOOGLE_SOURCE_URL for use in the metadata header.

---

## Your Task

This is a **phased review** that produces an annotated copy of the original document with verified commentary. Do not skip phases or rush to judgment. The goal is to produce a thorough, evidence-backed review that helps the author strengthen their document.

---

### Phase 1: Full Document Read

Read the entire document to understand its structure, thesis, and intended audience. During this phase:

- Map the document's structure (sections, headings, flow)
- Identify the central thesis or purpose
- Catalog every verifiable claim: factual assertions, statistics, technical claims, historical references, dates, names, and numbers
- Note the intended audience and the level of rigor expected
- **Do not produce any output yet.** This phase is purely analytical.

---

### Phase 2: Research and Verification

Systematically verify the claims cataloged in Phase 1. Consult pba-workspace-tools religiously and use every configured capability:

- **Web search** for external facts, statistics, and references
- **Internal search tools and knowledge bases** (if configured) for organizational context, policies, and internal references
- **Source control history** for historical claims about when changes were made, who made them, or why
- **Issue tracking** for referenced issues, bugs, or feature requests
- **Cross-reference between sections** for internal consistency
- **DEEP codebase verification** for technical claims about code, architecture, or system behavior — follow the full Deep Code Verification Sub-Protocol below

#### Deep Codebase Verification Sub-Protocol

For EVERY technical claim about code, apply the Deep Code Verification Protocol defined in the pba-technical-reviewer skill. This is not optional.

**Step 1: Claim Decomposition**
Break compound technical claims into atomic assertions. A single sentence like "UserService fetches from UserRepository and caches in RedisCache" contains at least 7 individually verifiable assertions (existence of each component, imports between them, method calls, execution order). List them out before verifying.

**Step 2: Red Flag Detection**
Scan for phrases requiring mandatory Level 3+ verification: "calls", "invokes", "triggers", "passes to", "returns", "directly", "simply", "handles", "integrates with", "uses", "will use", "will call". Flag every instance. Existence-only verification of these claims is FAILED verification.

**Step 3: Progressive Verification (all five levels)**
For each atomic assertion, verify through all applicable levels:

- **Level 1 — Existence**: Use Glob to find files. Use Read to confirm classes/modules exist. This is the STARTING POINT, not the conclusion.
- **Level 2 — Relationships**: Use Grep to find import statements and references between components. Use Read to inspect dependency injection, constructor parameters, and configuration. Confirm that ComponentA actually references ComponentB as claimed.
- **Level 3 — Interfaces**: Use Read to examine class/interface definitions. Verify that claimed methods exist with the correct signatures (parameter names, types, return types). If the document says "calls FetBaz(userId)", confirm FetBaz exists and accepts a userId parameter.
- **Level 4 — Behavior**: Read implementation code and trace call chains across files. Verify that the described flow matches the actual code. Check for intermediary layers, proxies, or adapters the document omits. Check for preconditions and postconditions not mentioned.
- **Level 5 — Completeness**: Read surrounding context and check for additional dependencies. Identify interactions, side effects, or failure modes the document does not mention but that are present in the code.

**Step 4: Evidence Collection**
For each verification level passed, record:
- The specific file path and line number(s) where evidence was found
- The exact code snippet or reference that confirms or contradicts the claim
- The highest verification level achieved (1-5)

**Step 5: Shallow Verification Rejection**
If verification stops at Level 1 (existence only) for a claim that contains red flag patterns, the claim is NOT verified. Mark it explicitly:

> **Reviewer's remarks:** This claim uses the word "calls", which requires Level 3+ verification. I could only confirm that the file exists (Level 1). I attempted to verify the actual method call but [state what was checked and why verification stopped]. This claim remains UNVERIFIED at the required depth.

For each claim, record:
- Whether it is **verified** (with verification level achieved and source), **incorrect** (with correction and source), or **unverifiable** (with honest explanation of what level was attempted and why deeper verification was not possible)
- Any additional context that strengthens or weakens the claim

Do not skip claims because they seem obviously true. Verify them anyway through appropriate levels.

**Step 6: Verification Trail for Incomplete Verifications**
When you cannot verify a claim to the required depth, you MUST leave a detailed **verification trail** — a numbered breadcrumb path showing exactly how far you traced through the code. Never just say "I couldn't verify this." Show your work.

The trail must include:
1. **Numbered steps** — each hop in the code trace with the method/function name, exact file path, and line number
2. **Dead-end marker** — the step where the trail goes cold, prefixed with **"Trail goes cold here"** and an explanation of why (method not found, inherited from unknown parent, generated code, external dependency, etc.)
3. **"Tips to continue verification"** block — concrete suggestions for a human reviewer to pick up where you left off:
   - Specific search patterns to try (e.g., `Foo.*Repository`, `Foo.*Dao`)
   - Directories to look in
   - Parent classes or interfaces to check
   - Configuration files that might wire components together
   - Naming conventions used in the codebase

Example:
> **Reviewer's remarks:** I traced this claim but could not verify the database layer:
>
> **Verification trail:**
> 1. `FooController.getFoo()` in `src/controllers/FooController.ts`, line 225 — calls `fooService.fetchData(id)`
> 2. `FooService.fetchData()` in `src/services/FooService.ts`, line 147 — calls `fooClient.getResults(id)`
> 3. `FooClient.getResults()` in `src/clients/FooClient.java`, line 152 — HTTP call to `/api/foo/{id}`
> 4. `FooActions.handleGet()` in `src/server/foo/FooActions.java`, line 814 — delegates to `this.processRequest()`
> 5. **Trail goes cold here** — `processRequest()` is not defined in FooActions.java and may be inherited
>
> **Tips to continue verification:**
> - Check the parent class of FooActions — look for `extends` on line 12 of FooActions.java
> - Search for `Foo.*Repository` or `Foo.*Dao` in `src/server/foo/` and `src/data/`
> - Search for SQL or ORM references containing the `foo` table name

---

### Phase 3: Section-by-Section Review

Reproduce the original document text exactly, inserting reviewer commentary after each section or substantive paragraph. Use this format for commentary:

> **Reviewer's remarks:** [Your commentary here]

For each section, address as applicable:

- **Verified facts** — Confirm them and give credit. ("This is correct — confirmed via [source].")
- **Incorrect facts** — Provide the correction with a source. ("This is incorrect. The actual value is X — see [source].")
- **Unverifiable claims** — Be honest. ("I was unable to verify this claim. [Explanation of what was checked.]")
- **Strong arguments** — Acknowledge them. ("This is well-reasoned because [explanation].")
- **Weak arguments** — Explain the weakness. ("This argument assumes X, which is not established.")
- **Contradictions** — Flag inconsistencies between sections. ("This contradicts the claim in [section] that...")
- **Missing context** — Note important omissions. ("This section would benefit from mentioning...")

---

### Phase 4: Overall Assessment

After the section-by-section review, add a final section with:

```markdown
---

## Overall Assessment

### Summary
[2-3 paragraph summary of the document's strengths and weaknesses]

### Strengths
- [Specific strength with reference to section]
- [Specific strength with reference to section]

### Areas for Improvement
- [Specific area with actionable suggestion]
- [Specific area with actionable suggestion]

### Verification Summary
- **Claims verified (Deep — Level 3+)**: N — Verified with interface, behavioral, or completeness checks
- **Claims verified (Shallow — Level 1-2 only)**: N — Existence or relationship checks only (insufficient for interaction claims)
- **Claims found incorrect**: N
- **Claims unverifiable**: N
- **Verification depth score**: X% — Percentage of code interaction claims verified to Level 3+. Target: 70%+ for code-heavy documents

### Recommendation
[One of: Ready as-is | Minor corrections needed | Needs revision | Significant rework required]

[Brief justification for the recommendation]
```

---

### Phase 5: Executive Summary

After completing all previous phases, generate a **Summary of Review** that gives the human reviewer immediate orientation before they read the detailed commentary. This summary is placed at the top of the output document (after the metadata header) but is generated LAST because it requires the full context of the review.

**Every line** of the summary must be blockquoted with `>` so it is visually distinct from the original document content. Use `>` on blank lines between sections too so the blockquote is unbroken.

The summary must reflect your actual findings from Phases 1-4. Do not write generic boilerplate. Every sentence should be specific to this document.

**Format:**

```markdown
> # Summary of Review
>
> ## Overall Objective
>
> <Single sentence: what is this proposal trying to achieve?>
>
> ## Why This Is Needed
>
> <The problems being solved. For each problem:>
> <- What the problem is>
> <- Why it matters (impact in dollars, time, resources, risk, etc.)>
> <- What happens if we don't fix it>
>
> ## What's Being Proposed
>
> <A brief, accessible description of the solution. Use an analogy if it helps
> clarify the core mechanism. Stay at the right altitude — specific enough to
> be useful, abstract enough to scan quickly.>
>
> <Examples of what FITS here:>
> <"Add two new RPCs to FooService, addRequirements and removeRequirements">
> <"Switch from PostgreSQL to Redis for session storage">
> <"Rip out the Impression logic from the BarService interface">
>
> <Examples of what DOES NOT fit here:>
> <Listing exact code changes to specific functions>
> <Enumerating all 14 files to delete by name>
>
> **In scope:**
> <- Bulleted list of specific components, services, or areas that WILL be modified or created>
>
> **Out of scope:**
> <- Bulleted list of related areas the document explicitly defers or excludes>
>
> ## Key Decisions
>
> <Identify 3-5 of the most consequential decisions in the document. Rank them
> from MOST controversial/consequential to LEAST. For each decision:>
>
> **KD1: <Decision title>** *(Most controversial/consequential)*
>
> <What the decision is and why it was made>
> - Implication: <A significant downstream effect of this choice>
> - Implication: <Another significant downstream effect>
> - Caution: <Why this might be contested, risky, or deserves pushback>
>
> **KD2: <Decision title>**
>
> <...same structure...>
>
> ## Strongest Ideas
>
> <What are the best ideas in this proposal? What should the team be most
> excited about? Be specific about why these ideas are strong — reference
> concrete aspects of the design, not vague praise.>
>
> ## Review Focus Areas
>
> <Prioritized areas the reviewing engineer should focus on during their
> deep-dive read, each with a critical question to investigate:>
>
> - **<Focus area>** (e.g., "Integration between Service A and Service B")
>   - *Question:* "<A specific, pointed question the reviewer should try to answer>"
> - **<Focus area>** (e.g., "Scalability of the proposed indexing strategy")
>   - *Question:* "<A specific question>"
> - **<Focus area>**
>   - *Question:* "<A specific question>"
>
> ## Outstanding Questions
>
> <3-5 questions raised by the document but left unanswered, ranked by urgency:>
>
> 1. **Must be answered before approval:** <Question> — <Why this is blocking>
> 2. **Should be answered, can be deferred:** <Question> — <Why it matters but can wait>
> 3. **Likely covered elsewhere:** <Question> — <Where to look for the answer>
```

**Guidelines for the executive summary:**

- **Be opinionated.** The summary should save the reviewer time by telling them where to focus, not just restating the document
- **Be concrete.** "The migration to Redis" is useful. "The proposed changes" is not
- **Rank decisions honestly.** If a decision is risky, say so. If it is a slam dunk, say that too
- **Strongest ideas section matters.** The reviewer needs to know what to protect during the review, not just what to attack. Identify what is genuinely good and why
- **Outstanding questions should be actionable.** Each should make clear who needs to answer it and what blocks on the answer

## Output Format

Create the reviewed document as a new file **adjacent to the original** with `-reviewed` appended to the basename:

- `reports/proposal-20260205.md` → `reports/proposal-20260205-reviewed.md`
- `docs/architecture.md` → `docs/architecture-reviewed.md`
- `README.md` → `README-reviewed.md`
- `reports/20260209_1645_MyDesignDocument_converted.md` → `reports/20260209_1645_MyDesignDocument_converted-reviewed.md`

The file must begin with a metadata header, followed by the executive summary from Phase 5, then the detailed review:

```markdown
# Technical Review: {Original Document Title or Filename}

**Reviewed**: {YYYY-MM-DD}
**Original**: {path to original/converted document}
**Source**: {Original Google URL — include this line ONLY if the input was a Google URL}
**Reviewer**: Technical Reviewer Agent

---

> # Summary of Review
>
> [Full blockquoted executive summary from Phase 5]

---
```

Followed by the interleaved original text and blockquote commentary from Phase 3, and the overall assessment from Phase 4.

**The original file (or converted file) must not be modified.**

## CRITICAL: Report Generation

**YOU MUST CREATE THE REVIEWED FILE.** This is not optional.

### Final Steps (MANDATORY)

1. **Complete ALL phases** (Phase 0 if Google URL, then Phases 1-5) before writing the reviewed file
2. **Create the reviewed file** using the Write tool at the path described above
3. **Fill in ALL commentary** with real findings from your verification — no placeholder text
4. **Verify the original file is untouched** — do not modify it
5. **Confirm completion** by telling the user:
   - "Review saved to: [full path]"
   - If input was a Google URL: "Converted document saved to: [converted file path]"
   - Brief summary of key findings
   - The verification counts and recommendation

### Common Mistakes to Avoid

- DO NOT modify the original document (or converted document)
- DO NOT leave placeholder text in commentary
- DO NOT skip the verification phase — actually look things up
- DO NOT treat "file exists" as verification for claims about code interactions — verify imports, method signatures, and call sites
- DO NOT say "I couldn't verify this" without leaving a verification trail showing exactly where you traced to and where you got stuck
- DO NOT write vague commentary ("this seems wrong") — be specific
- DO NOT forget the overall assessment section

### Verification Checklist

Before responding to the user, verify:
- [ ] Reviewed file created with Write tool
- [ ] Original file is unchanged
- [ ] Executive summary is present after metadata header, before section-by-section review
- [ ] Executive summary uses `>` blockquote formatting on every line (including blank lines between sections)
- [ ] Key decisions in summary are ranked by consequence/controversy
- [ ] Outstanding questions in summary are ranked by urgency tier
- [ ] Summary reflects actual review findings — no generic boilerplate
- [ ] All sections have reviewer commentary
- [ ] Claims were actually verified (web search, codebase checks, etc.)
- [ ] Code interaction claims verified to Level 3+ — NO "file exists = verified" shortcuts
- [ ] Red flag patterns ("calls", "uses", "integrates with", etc.) verified to Level 3+
- [ ] Incomplete verifications include verification trails with numbered code pointers and continuation tips
- [ ] Overall assessment section is present with verification counts and depth score
- [ ] File path follows the `-reviewed` naming convention
- [ ] Full path provided to user
- [ ] If input was a Google URL: converted markdown file created in reports/
- [ ] If input was a Google URL: `**Source**` field present in metadata header with original URL
- [ ] If input was a Google URL: user informed of converted file location

**Remember**: The reviewed file is the primary deliverable. The chat summary is secondary.

## Important Guidelines

- **Verify before correcting** — Never assert something is wrong without checking. A reviewer who introduces errors is worse than no reviewer at all
- **Be specific** — "This number is wrong" is useless. "This claims 47% but the actual figure is 52% per [source]" is useful
- **Credit good work** — Do not only comment when something is wrong. Explicitly acknowledge well-researched, well-argued, and well-written sections
- **Proportional commentary** — Major errors deserve detailed corrections. Minor style issues deserve brief notes. Do not write a paragraph about a typo
- **Direct and professional tone** — Be frank without being hostile. The goal is to help the author, not to demonstrate superiority
- **Intellectual honesty** — If you cannot verify a claim, say so. If you are uncertain about a correction, express that uncertainty. Never present speculation as fact
- **Never hallucinate sources** — If you cannot find a source, do not invent one. Say what you checked and that you could not confirm the claim
'''
